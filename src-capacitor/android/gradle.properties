# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx1536m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Версия Android-сборки (Фаза 13, задача 13.3).
#
# versionCode — целое, растёт на КАЖДЫЙ релиз: Android сравнивает именно его и
# отказывается ставить APK с меньшим или равным значением.
# versionName — «человеческая» версия, её видит пользователь и она уезжает в
# манифест релиза (`releases.json`).
#
# 1.3 (code 4): чип синка больше не перекрывает карточку заказа (жалоба мастера, задача 14.11).
# 1.4 (code 5): связь с сервером больше не «пропадает» на Android — синк, проверка версии
#   и очередь отчётов не блокируются залипшим `navigator.onLine`; «осиротевшая» очередь
#   (операции без родителя) больше не висит вечно — есть «Починка очереди» в «Режиме
#   разработчика» (дефект живого прогона 14.11).
# 1.5 (code 6): удаление заказа больше не «залипает» — заказ и его позиции удаляются
#   вместе (было `FOREIGN KEY constraint failed` на устройстве, где внешние ключи
#   включены; жалоба мастера, отчёт №2 → задача 14.15). Ошибки экрана заказа и каталога
#   теперь пишутся в постоянный буфер и попадают в отчёт «Сообщить об ошибке».
APP_VERSION_CODE=6
APP_VERSION_NAME=1.5

