android.useAndroidX=true

# Версия Android-сборки (Фаза 13, задача 13.3).
#
# versionCode — целое, растёт на КАЖДЫЙ релиз: Android сравнивает именно его и
# отказывается ставить APK с меньшим или равным значением.
# versionName — «человеческая» версия, её видит пользователь и она уезжает в
# манифест релиза (`releases.json`).
#
# 1.3 (code 4): чип синка больше не перекрывает карточку заказа (жалоба мастера, задача 14.11).
# 1.4 (code 5): связь с сервером больше не «пропадает» на Android — синк, проверка версии
#   и очередь отчётов не блокируются залипшим `navigator.onLine`; «осиротевшая» очередь
#   (операции без родителя) больше не висит вечно — есть «Починка очереди» в «Режиме
#   разработчика» (дефект живого прогона 14.11).
# 1.5 (code 6): удаление заказа больше не «залипает» — заказ и его позиции удаляются
#   вместе (было `FOREIGN KEY constraint failed` на устройстве, где внешние ключи
#   включены; жалоба мастера, отчёт №2 → задача 14.15). Ошибки экрана заказа и каталога
#   теперь пишутся в постоянный буфер и попадают в отчёт «Сообщить об ошибке».
# 1.6 (code 7): количество работ и товаров в заказе (отчёт мастера №3 → задача 14.19):
#   «подкачать колесо» ×4 — одна строка с количеством; количество всегда целое ≥ 1 и
#   меняется только в режиме правки. Жалоба владельца «в списке заказов сумма неверная»:
#   итог списка считается из позиций, как в карточке и аналитике (задача 14.20).
#   Себестоимость убрана из карточки заказа (задача 14.21), а причина отказа сервера
#   теперь видна в «Режиме разработчика» и уезжает в отчёт (задача 14.22).
# 1.7 (code 8): склад разделён на вкладки «товары» и «движение товаров» (задача 14.24):
#   лента приходов «+» и расходов «−» по всем товарам профиля с фильтром, история прихода
#   редактируется (количество — пока приход не уехал на сервер, закупка и поставщик — всегда),
#   диалоги больше не вылезают за экран (прокручивается тело). UI по правкам владельца
#   (задача 14.23): подсказки «материалов пока нет» и «добавить можно на вкладках выше»
#   гаснут, когда позиции есть; карточки во всю ширину телефона; количество меняют явными
#   стрелками влево/вправо («‹ N ›»); «что нового» печатается списком через тире.
#   Маржа (задача 14.25): правка заказа больше не стирает закупку строк, количество строки
#   не тянет остаток склада, цену закупки можно задать в карточке товара.
# 1.8 (code 9): на Android вкладка «движение товаров» больше не пустая (задача 14.26).
#   В `product_categories.specialization_id` лежит либо локальный UUID (категория создана
#   на устройстве), либо серверный id (категория приехала синком), поэтому фильтр истории
#   идёт по двум формам ключа профиля (общий `specializationsRepo.resolveScopeKeys()`).
#   Пустая лента теперь показывает счётчики движений по всей базе — «не тот фильтр» видно
#   на экране. В браузере дефект не проявлялся: там категории созданы локально.
# 1.9 (code 10): обновления без установки (Фаза 15, решение D8). В сборку добавлен плагин OTA
#   (@capawesome/capacitor-live-update 7.5.0, MIT, self-hosted): правки интерфейса и логики
#   приезжают сами — приложение скачивает небольшой zip, сверяет sha256 и применяет его при
#   следующем запуске. Системного диалога установки и разрешения «неизвестный источник»
#   больше не нужно. Кнопка «Обновить без установки» и версия веб-слоя — в разделе «Ещё».
#   ⚠️ Это первый APK с OTA: сама раздача бандлов включается бэкенд-задачей 15.7.
# 1.10 (code 11): хотфикс чёрного экрана 1.9. В `src/boot/liveUpdate.js` стоял `await` на
#   вызовах плагина OTA, а Quasar дожидается boot-файлов **перед** монтированием приложения —
#   если плагин не отвечал, приложение не монтировалось и оставался чёрный экран (виден
#   сразу после установки 1.9 на живой телефон). Теперь boot-файл ничего не ждёт: работа с
#   плагином ушла в фон (`updateService.startBundleSupport()`), у коротких вызовов появился
#   таймаут (3 с), а `ready()` при молчании повторяется один раз (5 с).
#   Правило: **в boot-файлах OTA не должно быть `await`** (держит тест).
# 1.11 (code 12): «версия приложения неизвестна» на Android исправлена. Версия читалась
#   единственным источником (`@capacitor/app`), а неудачное чтение запоминалось навсегда —
#   поэтому в «Ещё → приложение» оставалось «неизвестна», хотя код плагинов и сборка были
#   в порядке. Теперь источников два (`App.getInfo()` → `getVersionCode()/getVersionName()`
#   плагина OTA), у обоих таймаут 3 с, провал не запоминается, а кнопка «Проверить
#   обновление» перечитывает версию принудительно. Причину сбоя пишем в буфер ошибок —
#   она видна в отчёте «Сообщить об ошибке».
# 1.12 (code 13): проверка обновлений больше не «молчит» на Android. Два дефекта:
#   (1) в сторе результат `refreshCurrentVersion()` (объект версии) присваивался в `status`,
#   поэтому раздел «приложение» показывал «обновления ещё не проверялись», а кнопка
#   «Проверить обновление» выглядела мёртвой;
#   (2) динамический импорт чанка плагина OTA не был защищён таймаутом — если чанк в WebView
#   не загружался, промис не оседал, и `check()` не доходил до запроса к серверу (в логах
#   контура от телефона не было ни одного `/api/app-version`). Теперь импорт истекает по
#   времени, и проверка версии работает даже без OTA-плагина.
# 1.13 (code 14): OTA-обновления заработали. Корневая причина: прокси плагина Capacitor на
#   незнакомое свойство отвечает ошибкой «не реализовано», а `then` — ровно такое свойство
#   (в отчёте мастера: `"LiveUpdate.then()" is not implemented on android`). Промис, который
#   «оседает» на самом прокси, из-за этого не завершается никогда — поэтому молчали `ready()`,
#   текущий бандл и версия из плагина, а 1.11 ещё и «вешала» всю проверку обновлений.
#   Теперь мост отдаёт наружу обычную обёртку с привязанными методами (как `loadApkInstaller()`
#   с `{ ApkInstaller }`), а импорт плагина под таймаутом.
# 1.14 (code 15): первый нативный релиз после того, как OTA заработал (живой прогон 15.9).
#   Содержимое совпадает с бандлом 1.13.260915-1309 (запрет «понижения» бандла, сброс ожидания
#   после установки APK), но теперь эти правки лежат и во встроенном веб-слое APK.
#   ⚠️ Выкатывать такие релизы нужно с `--with-bundle`: тогда на контуре сразу появляется бандл,
#   собранный для этой сборки (иначе там остался бы бандл прошлой, и мастер мог увидеть
#   предложение «обновления без установки» на старый веб-слой — от этого спасает и правило
#   в клиенте, но лучше не оставлять мусор).
APP_VERSION_CODE=15
APP_VERSION_NAME=1.14

# Номер OTA-релиза веб-слоя (Фаза 15, задача 15.21).
#
# Идентификатор бандла — `<APP_VERSION_NAME>.<номер>.<ддммгг-ччмм>`, например
# `1.14.7.260915-1440`: префикс — версия APK-линии (растёт только нативным релизом),
# номер — какой это по счёту выкат веб-слоя, время — уникальность в пределах минуты.
# `scripts/release-web.sh` берёт следующий номер как «максимум из этого поля и номера
# бандла на контуре, плюс один»: контур важнее, поле — только пол для случая
# недоступного манифеста. После выката поднимите его, чтобы запись жила в репозитории.
# ⚠️ Счётчик ведётся **в пределах APK-линии**: при подъёме `APP_VERSION_NAME`
# (нативный релиз) обнулите поле — иначе новая линия продолжит нумерацию старой.
# APK при этом не меняется: `APP_VERSION_CODE`/`APP_VERSION_NAME` не трогаем.
APP_BUNDLE_BUILD=2

