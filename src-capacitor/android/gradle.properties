# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Версия Android-сборки (Фаза 13, задача 13.3).
#
# versionCode — целое, растёт на КАЖДЫЙ релиз: Android сравнивает именно его и
# отказывается ставить APK с меньшим или равным значением.
# versionName — «человеческая» версия, её видит пользователь и она уезжает в
# манифест релиза (`releases.json`).
#
# 1.3 (code 4): чип синка больше не перекрывает карточку заказа (жалоба мастера, задача 14.11).
# 1.4 (code 5): связь с сервером больше не «пропадает» на Android — синк, проверка версии
#   и очередь отчётов не блокируются залипшим `navigator.onLine`; «осиротевшая» очередь
#   (операции без родителя) больше не висит вечно — есть «Починка очереди» в «Режиме
#   разработчика» (дефект живого прогона 14.11).
# 1.5 (code 6): удаление заказа больше не «залипает» — заказ и его позиции удаляются
#   вместе (было `FOREIGN KEY constraint failed` на устройстве, где внешние ключи
#   включены; жалоба мастера, отчёт №2 → задача 14.15). Ошибки экрана заказа и каталога
#   теперь пишутся в постоянный буфер и попадают в отчёт «Сообщить об ошибке».
# 1.6 (code 7): количество работ и товаров в заказе (отчёт мастера №3 → задача 14.19):
#   «подкачать колесо» ×4 — одна строка с количеством; количество всегда целое ≥ 1 и
#   меняется только в режиме правки. Жалоба владельца «в списке заказов сумма неверная»:
#   итог списка считается из позиций, как в карточке и аналитике (задача 14.20).
#   Себестоимость убрана из карточки заказа (задача 14.21), а причина отказа сервера
#   теперь видна в «Режиме разработчика» и уезжает в отчёт (задача 14.22).
# 1.7 (code 8): склад разделён на вкладки «товары» и «движение товаров» (задача 14.24):
#   лента приходов «+» и расходов «−» по всем товарам профиля с фильтром, история прихода
#   редактируется (количество — пока приход не уехал на сервер, закупка и поставщик — всегда),
#   диалоги больше не вылезают за экран (прокручивается тело). UI по правкам владельца
#   (задача 14.23): подсказки «материалов пока нет» и «добавить можно на вкладках выше»
#   гаснут, когда позиции есть; карточки во всю ширину телефона; количество меняют явными
#   стрелками влево/вправо («‹ N ›»); «что нового» печатается списком через тире.
#   Маржа (задача 14.25): правка заказа больше не стирает закупку строк, количество строки
#   не тянет остаток склада, цену закупки можно задать в карточке товара.
APP_VERSION_CODE=8
APP_VERSION_NAME=1.7

